<!doctype html>
<html lang="en" class="dark"> <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    
    <title>Blue Lotus | AI App Orchestrator</title>
    <meta name="description" content="Advanced AI-integrated platform for autonomous application creation." />
    <meta name="theme-color" content="#0f172a" /> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
      /* Critical CSS: Prevent white flash before React loads */
      body { 
        background-color: #0f172a; 
        margin: 0; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh;
      }
      /* Simple Loader for UX */
      .lotus-loader {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(56, 189, 248, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Blue Lotus.</noscript>
    
    <div id="root">
      <div class="lotus-loader"></div>
    </div>
  </body>
</html>
