<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blue Lotus | AI App Orchestrator</title>
    <meta name="description" content="Advanced AI platform for autonomous application generation." />
    <meta name="theme-color" content="#09090B" />
    <style>
        /* Critical CSS: Instant Ink & Cyan Transition */
        body {
            background-color: #09090B; /* True Ink */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Industrial Cyan Pulse */
        .lotus-pulse {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(6, 182, 212, 0.1);
            border-top-color: #06B6D4; /* Cyan Actuation */
            border-radius: 50%;
            animation: spin 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Startup Textual Metadata */
        .loading-status {
            position: absolute;
            bottom: 40px;
            font-family: monospace;
            font-size: 10px;
            color: #06B6D4;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="lotus-pulse"></div>
        <div class="loading-status">Stabilizing_Neural_Bridge...</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
