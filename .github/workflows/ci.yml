# .github/workflows/ci.yml enhancements
publish-templates:
  name: Validate and Harden Templates
  runs-on: ubuntu-latest
  needs: build
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: npm ci

    # ELITE UPGRADE: Automatic JSON Schema Validation
    - name: Validate Templates
      run: |
        # Ensures AI-generated templates strictly follow your architectSpec
        npm run validate:templates 

    # SECURITY UPGRADE: Secret Scanning
    - name: Scan for Leaked Keys
      uses: trufflesecurity/trufflehog@main
      with:
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
