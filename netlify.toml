# netlify.toml (Hardened Architecture)
[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ELITE UPGRADE: Single Page Application (SPA) Routing
# This ensures that refreshing the page on a sub-route doesn't throw a 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# SECURITY UPGRADE: Hardened Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
